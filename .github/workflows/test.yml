on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: yarn install --frozen-lockfile
      - run: yarn tsc
      - run: yarn format-check
      - run: yarn playwright install --with-deps
      - run: yarn playwright test
